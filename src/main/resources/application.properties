spring.application.name=alky-wallet

# Servidor
server.port=${PORT:8080}

# Base de Datos (Docker / PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alky_wallet}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad y JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Inicialización de Datos (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Mercado Pago (Sandbox) ---
# Se generan gratis al crear una aplicación en https://www.mercadopago.com.ar/developers
# No hay valor por defecto a propósito: si falta, MercadoPagoService devuelve un 503 en vez
# de fallar en silencio o de tener un secreto de prueba hardcodeado en el repo.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
# Base para los back_urls (a donde vuelve el navegador del usuario tras pagar)
mercadopago.back-url-base=${MERCADOPAGO_BACK_URL_BASE:http://localhost:8080}
# URL pública donde Mercado Pago puede llamar al webhook. En local hace falta un túnel
# (ver CHANGELOG), por ejemplo con ngrok: https://xxxx.ngrok-free.app/api/mercadopago/webhook
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}

# --- Asistente IA (Ollama local) ---
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.3:8b}
