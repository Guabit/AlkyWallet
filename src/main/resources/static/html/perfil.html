<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlkyWallet - Perfil</title>

    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de Colores Personalizados para Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgMain: "#0D0B14",
              cardDark: "#161221",
              fuchsiaNeon: "#E025CE",
              turquoiseNeon: "#00F2FE",
              textLight: "#F4F4F6",
            },
          },
        },
      };
    </script>

    <!-- Enlace a tu hoja de estilos personalizada -->
    <link rel="stylesheet" href="../css/custom.css" />
    <script defer src="../js/sidebar.js"></script>
    <script defer src="../js/auth-session.js"></script>

  </head>
  <body
    class="bg-bgMain text-textLight min-h-screen flex flex-col md:flex-row relative font-sans m-0 p-0 overflow-x-hidden"
  >
    <!-- LUCES DE FONDO DE NEÓN -->
    <div
      class="absolute -top-10 -left-10 w-96 h-96 bg-fuchsiaNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute -bottom-10 -right-10 w-96 h-96 bg-turquoiseNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"
    ></div>

    <!-- SIDEBAR / MENÚ LATERAL -->
    <aside
      class="w-full md:w-64 bg-cardDark/80 backdrop-blur-md border-b md:border-b-0 md:border-r border-gray-800 p-4 md:p-6 flex flex-col justify-between z-20 shrink-0"
    >
      <div>
        <!-- Header Móvil + Logo -->
        <div
          class="flex items-center justify-between md:justify-start space-x-3 mb-4 md:mb-8"
        >
          <div class="flex items-center space-x-3">
            <div
              class="w-10 h-10 md:w-12 md:h-12 bg-cardDark border border-fuchsiaNeon rounded-xl flex items-center justify-center shadow-lg shrink-0"
            >
              <svg
                class="w-6 h-6 md:w-7 md:h-7"
                fill="none"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="#00F2FE"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M7 20V4m0 0L3 8m4-4l4 4"
                />
                <path
                  stroke="#E025CE"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17 4v16m0 0l4-4m-4 4l-4-4"
                />
              </svg>
            </div>
            <h1
              class="text-lg md:text-xl font-extrabold tracking-wider whitespace-nowrap"
            >
              <span
                class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon"
                >ALKY</span
              >WALLET
            </h1>
          </div>

          <!-- Botón Hamburguesa (Solo visible en Mobile) -->
          <button
            id="btn-menu"
            class="md:hidden text-gray-400 hover:text-white focus:outline-none"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>

        <!-- Navegación: Oculta en Mobile por defecto (`hidden`), visible en Desktop (`md:flex`) -->
        <nav
          id="menu-nav"
          class="hidden md:flex flex-col space-y-2 mt-4 md:mt-0 border-t border-gray-800/80 pt-4 md:pt-0 md:border-0"
        >
          <!-- 1. Dashboard -->
          <a
            href="tableroDeControl.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              />
            </svg>
            <span>Dashboard</span>
          </a>

          <!-- 2. Transferencias -->
          <a
            href="tranferencia.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
              />
            </svg>
            <span>Transferencias</span>
          </a>

          <!-- 3. Depósitos -->
          <a
            href="deposito.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6v6m0 0v6m0-6h6m-6 0H6"
              />
            </svg>
            <span>Depósitos</span>
          </a>

          <!-- 4. Perfil -->
          <a
            href="perfil.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-fuchsiaNeon text-white font-semibold text-sm transition shadow-lg shadow-fuchsiaNeon/20"
          >
            <svg
              class="w-5 h-5 opacity-90"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span>Perfil</span>
          </a>
        </nav>
      </div>

      <!-- Botón Salir (Oculto en móvil salvo que se abra el menú) -->
      <div
        id="menu-salir"
        class="hidden md:block pt-4 border-t border-gray-800 mt-6"
      >
        <button
          id="btn-salir"
          class="w-full flex items-center space-x-2 text-gray-400 hover:text-red-400 transition text-sm font-medium"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5"
            />
          </svg>
          <span>Salir de ALKYWALLET</span>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main
      class="flex-grow flex flex-col justify-between p-6 md:p-12 z-10 min-h-screen"
    >
      <div>
        <!-- HEADER SUPERIOR DE USUARIO -->
        <div class="flex justify-end items-center mb-6">
          <div
            class="flex items-center space-x-3 bg-cardDark/60 backdrop-blur-md px-4 py-2 rounded-full border border-gray-800"
          >
            <span class="user-email text-sm font-medium text-white">Cargando...</span>
            <img
              src="https://i.pravatar.cc/100?img=12"
              alt="Foto de Perfil"
              class="w-8 h-8 rounded-full border border-turquoiseNeon object-cover"
            />
          </div>
        </div>

        <!-- CONTENEDOR DE LA TARJETA PERFIL -->
        <div class="max-w-md mx-auto w-full">
          <div
            class="perfil-box bg-cardDark rounded-2xl p-8 relative shadow-2xl border border-fuchsiaNeon/30 glow-card-fuchsia"
          >
            <!-- Avatar y Nombre del Usuario -->
            <div
              class="perfil-header flex items-center space-x-4 mb-6 pb-6 border-b border-gray-800/80"
            >
              <div class="relative">
                <img
                  src="https://i.pravatar.cc/100?img=12"
                  alt="Foto de perfil del cliente"
                  class="w-16 h-16 rounded-full border-2 border-fuchsiaNeon object-cover shadow-lg"
                />
              </div>
              <div>
                <h2
                  id="nombre-cliente"
                  class="user-email text-2xl font-bold text-white tracking-wide"
                >
                  Cargando...
                </h2>
                <p
                  class="text-xs text-turquoiseNeon font-medium uppercase tracking-widest"
                >
                  Cuenta Personal
                </p>
              </div>
            </div>

            <!-- Formulario de Perfil -->
            <form id="form-perfil" class="space-y-4">
              <!-- Email -->
              <div class="campo">
                <label
                  for="email"
                  class="block text-xs text-gray-400 mb-1 font-medium"
                  >Email</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="ejemplo@correo.com"
                  class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm"
                />
              </div>

              <!-- Celular -->
              <div class="campo">
                <label
                  for="celular"
                  class="block text-xs text-gray-400 mb-1 font-medium"
                  >Celular</label
                >
                <input
                  type="tel"
                  id="celular"
                  name="celular"
                  placeholder="Ej: 2920123456"
                  class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm"
                />
              </div>

              <!-- DNI -->
              <div class="campo">
                <label
                  for="dni"
                  class="block text-xs text-gray-400 mb-1 font-medium"
                  >DNI</label
                >
                <input
                  type="text"
                  id="dni"
                  name="dni"
                  placeholder="Ej: 12345678"
                  class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm"
                />
              </div>

              <!-- Dirección -->
              <div class="campo">
                <label
                  for="direccion"
                  class="block text-xs text-gray-400 mb-1 font-medium"
                  >Dirección</label
                >
                <input
                  type="text"
                  id="direccion"
                  name="direccion"
                  placeholder="Ej: Calle 123"
                  class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm"
                />
              </div>

              <!-- Botón Guardar -->
              <div class="botones-accion pt-4">
                <button
                  type="submit"
                  id="btn-guardar"
                  class="w-full bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon text-white font-bold py-2.5 rounded-xl shadow-lg hover:opacity-90 transition duration-300 glow-button text-sm"
                >
                  Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <footer class="w-full text-center text-xs text-gray-500 mt-8">
        <p>&copy; 2026 ALKYWALLET. Todos los derechos reservados</p>
      </footer>
    </main>
  </body>
</html>
