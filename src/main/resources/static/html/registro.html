<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkyWallet - Registro</title>
    
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración de Colores Personalizados para Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgMain: '#0D0B14',
              cardDark: '#161221',
              fuchsiaNeon: '#E025CE',
              turquoiseNeon: '#00F2FE',
              textLight: '#F4F4F6',
            }
          }
        }
      }
    </script>

    <!-- Hoja de estilos personalizados y JavaScript -->
    <link rel="stylesheet" href="../css/custom.css">
    <!-- CDN de Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script defer src="../js/registro.js"></script>

</head>
<body class="bg-bgMain text-textLight min-h-screen flex flex-col justify-between relative overflow-x-hidden font-sans">

    <!-- LUCES DE FONDO DE NEÓN -->
    <div class="absolute -top-10 -left-10 w-96 h-96 bg-fuchsiaNeon rounded-full opacity-25 filter blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -right-10 w-96 h-96 bg-turquoiseNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-grow flex items-center justify-center p-6 z-10">
        <div class="w-full max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-12">
            
            <!-- COLUMNA IZQUIERDA: Branding con Logo Neón -->
            <div class="flex flex-col items-start space-y-4">
                <div class="flex items-center space-x-3">
                    <div class="w-14 h-14 bg-cardDark border border-fuchsiaNeon rounded-2xl flex items-center justify-center glow-fuchsia-sm shadow-lg">
                        <svg class="w-8 h-8" fill="none" stroke-width="2.5" viewBox="0 0 24 24">
                            <!-- Flecha Izquierda Subiendo (Turquesa) -->
                            <path stroke="#00F2FE" stroke-linecap="round" stroke-linejoin="round" d="M7 20V4m0 0L3 8m4-4l4 4" />
                            <!-- Flecha Derecha Bajando (Fucsia) -->
                            <path stroke="#E025CE" stroke-linecap="round" stroke-linejoin="round" d="M17 4v16m0 0l4-4m-4 4l-4-4" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-3xl font-extrabold tracking-wider">
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon">ALKY</span>WALLET
                        </h1>
                        <p class="text-xs text-turquoiseNeon tracking-widest font-semibold uppercase">Virtual Financial System</p>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Card de Registro -->
            <div class="w-full max-w-md bg-cardDark rounded-2xl p-8 relative shadow-2xl border border-fuchsiaNeon/30 glow-card-fuchsia">
                
                <h2 class="text-xl font-bold text-center mb-6 tracking-wide text-white uppercase">REGISTRARSE</h2>

                <form id="registro" class="space-y-4" novalidate>
                    <div>
                        <label for="Remail" class="block text-sm text-gray-400 mb-1 font-medium">Email</label>
                        <input type="email" id="Remail" autocomplete="email" placeholder="alkywallet@gmail.com"
                               class="w-full bg-[#0D0B14] text-white border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition duration-200">
                        <p id="errorEmail" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <div>
                        <label for="Rdni" class="block text-sm text-gray-400 mb-1 font-medium">DNI</label>
                        <input type="text" inputmode="numeric" id="Rdni" autocomplete="" placeholder="12345678" maxlength="8"
                               class="w-full bg-[#0D0B14] text-white border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition duration-200">
                        <p id="errorDni" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <div>
                        <label for="Rpassword" class="block text-sm text-gray-400 mb-1 font-medium">Contraseña</label>
                        <input type="password" id="Rpassword" autocomplete="new-password" placeholder="••••••••"
                               class="w-full bg-[#0D0B14] text-white border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition duration-200">
                        <p id="errorPassword" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <div>
                        <label for="r-password" class="block text-sm text-gray-400 mb-1 font-medium">Confirmar Contraseña</label>
                        <input type="password" id="r-password" autocomplete="new-password" placeholder="••••••••"
                               class="w-full bg-[#0D0B14] text-white border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition duration-200">
                        <p id="errorConfirmarPassword" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <!-- Mensaje de éxito -->
                    <p id="mensajeExito" class="text-emerald-400 text-sm text-center font-semibold hidden"></p>

                    <!-- Mensaje de error general del servidor -->
                    <p id="mensajeError" class="text-red-500 text-sm text-center font-semibold hidden"></p>

                    <div class="pt-4 flex items-center justify-between">
                        <button id="btn-registrar-1" type="submit" 
                                class="w-32 bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon text-white font-bold py-2.5 rounded-lg shadow-lg hover:opacity-90 transition duration-300 glow-button">
                            Registrarse
                        </button>
                        <a href="./ingresar.html" class=" text-sm text-turquoiseNeon hover:underline">
                            ¿Ya tienes una cuenta?
                        </a>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full py-4 text-center text-xs text-gray-500 z-10">
        <p>&copy; 2026 ALKYWALLET. Todos los derechos reservados</p>
    </footer>

</body>
</html>
