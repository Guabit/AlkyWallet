<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlkyWallet - Depósito</title>

    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de Colores Personalizados para Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgMain: "#0D0B14",
              cardDark: "#161221",
              fuchsiaNeon: "#E025CE",
              turquoiseNeon: "#00F2FE",
              textLight: "#F4F4F6",
            },
          },
        },
      };
    </script>

    <!-- Enlace a hoja de estilos personalizada -->
    <link rel="stylesheet" href="../css/custom.css" />
    <script defer src="../js/deposito.js"></script>
    <script defer src="../js/sidebar.js"></script>
    <script defer src="../js/auth-session.js"></script>

  </head>
  <body
    class="bg-bgMain text-textLight min-h-screen flex flex-col md:flex-row relative overflow-x-hidden font-sans"
  >
    <!-- LUCES DE FONDO DE NEÓN -->
    <div
      class="absolute -top-10 -left-10 w-96 h-96 bg-fuchsiaNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute -bottom-10 -right-10 w-96 h-96 bg-turquoiseNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"
    ></div>

    <!-- SIDEBAR / MENÚ LATERAL -->
    <aside
      class="w-full md:w-64 bg-cardDark/80 backdrop-blur-md border-b md:border-b-0 md:border-r border-gray-800 p-4 md:p-6 flex flex-col justify-between z-20 shrink-0"
    >
      <div>
        <!-- Header Móvil + Logo -->
        <div
          class="flex items-center justify-between md:justify-start space-x-3 mb-4 md:mb-8"
        >
          <div class="flex items-center space-x-3">
            <div
              class="w-10 h-10 md:w-12 md:h-12 bg-cardDark border border-fuchsiaNeon rounded-xl flex items-center justify-center shadow-lg shrink-0"
            >
              <svg
                class="w-6 h-6 md:w-7 md:h-7"
                fill="none"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="#00F2FE"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M7 20V4m0 0L3 8m4-4l4 4"
                />
                <path
                  stroke="#E025CE"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17 4v16m0 0l4-4m-4 4l-4-4"
                />
              </svg>
            </div>
            <h1
              class="text-lg md:text-xl font-extrabold tracking-wider whitespace-nowrap"
            >
              <span
                class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon"
                >ALKY</span
              >WALLET
            </h1>
          </div>

          <!-- Botón Hamburguesa (Solo visible en Mobile) -->
          <button
            id="btn-menu"
            class="md:hidden text-gray-400 hover:text-white focus:outline-none"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>

        <!-- Navegación: Oculta en Mobile por defecto (`hidden`), visible en Desktop (`md:flex`) -->
        <nav
          id="menu-nav"
          class="hidden md:flex flex-col space-y-2 mt-4 md:mt-0 border-t border-gray-800/80 pt-4 md:pt-0 md:border-0"
        >
          <!-- 1. Dashboard -->
          <a
            href="tableroDeControl.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              />
            </svg>
            <span>Dashboard</span>
          </a>

          <!-- 2. Transferencias -->
          <a
            href="tranferencia.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
              />
            </svg>
            <span>Transferencias</span>
          </a>

          <!-- 3. Depósitos -->
          <a
            href="deposito.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-fuchsiaNeon to-purple-600 text-white font-semibold shadow-lg text-sm"
          >
            <svg
              class="w-5 h-5 opacity-90"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6v6m0 0v6m0-6h6m-6 0H6"
              />
            </svg>
            <span>Depósitos</span>
          </a>

          <!-- 4. Inversiones -->
          <a
            href="inversiones.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 17l6-6 4 4 8-8M21 7v6m0-6h-6"
              />
            </svg>
            <span>Inversiones</span>
          </a>

          <!-- 5. Servicios -->
          <a
            href="servicios.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <rect x="4" y="4" width="7" height="7" rx="1.5" stroke-width="2" />
              <rect x="13" y="4" width="7" height="7" rx="1.5" stroke-width="2" />
              <rect x="4" y="13" width="7" height="7" rx="1.5" stroke-width="2" />
              <rect x="13" y="13" width="7" height="7" rx="1.5" stroke-width="2" />
            </svg>
            <span>Servicios</span>
          </a>

          <!-- 6. Perfil -->
          <a
            href="perfil.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span>Perfil</span>
          </a>
        </nav>
      </div>

      <!-- Botón Salir (Oculto en móvil salvo que se abra el menú) -->
      <div
        id="menu-salir"
        class="hidden md:block pt-4 border-t border-gray-800 mt-6"
      >
        <button
          id="btn-salir"
          class="w-full flex items-center space-x-2 text-gray-400 hover:text-red-400 transition text-sm font-medium"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5"
            />
          </svg>
          <span>Salir de ALKYWALLET</span>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main
      class="flex-grow flex flex-col justify-between p-6 md:p-12 z-10 min-h-screen"
    >
      <div>
        <!-- HEADER SUPERIOR DE USUARIO -->
        <div class="flex justify-end items-center mb-6">
          <div
            class="flex items-center space-x-3 bg-cardDark/60 backdrop-blur-md px-4 py-2 rounded-full border border-gray-800"
          >
            <span class="user-email text-sm font-medium text-white">Cargando...</span>
            <img
              src="https://i.pravatar.cc/100?img=12"
              alt="Foto de Perfil"
              class="w-8 h-8 rounded-full border border-turquoiseNeon object-cover"
            />
          </div>
        </div>

        <!-- CONTENEDOR DE LA TARJETA -->
        <div class="max-w-lg mx-auto w-full">
          <!-- TARJETA DE DEPÓSITO -->
          <div
            class="deposito-box bg-cardDark rounded-2xl p-6 md:p-10 relative shadow-2xl border border-fuchsiaNeon/30 glow-card-fuchsia"
          >
            <!-- Selector de Moneda con Menú Desplegable -->
            <div
              class="selector-moneda relative mb-6 flex justify-between items-center bg-[#0D0B14] p-3.5 rounded-xl border border-gray-800"
            >
              <div class="flex items-center space-x-2">
                <span
                  id="icono-moneda-actual"
                  class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center text-xs border border-emerald-500/40"
                  >$</span
                >
                <span id="texto-moneda-actual" class="text-sm font-semibold text-white">ARS (Pesos)</span>
              </div>
              <button
                type="button"
                id="btn-moneda"
                class="text-xs text-turquoiseNeon hover:underline flex items-center gap-1 font-medium focus:outline-none"
              >
                <span>Elegir moneda</span>
                <svg id="flecha-moneda" class="w-3.5 h-3.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </button>

              <!-- Menú Desplegable Flotante -->
              <div
                id="dropdown-moneda"
                class="hidden absolute right-0 top-full mt-2 w-64 bg-[#161221] border border-gray-700 rounded-xl shadow-2xl p-2 z-30 space-y-1 backdrop-blur-md"
              >
                <button
                  type="button"
                  data-moneda="ARS"
                  class="opcion-moneda w-full flex items-center justify-between p-2.5 rounded-lg text-left hover:bg-[#0D0B14] transition"
                >
                  <div class="flex items-center space-x-2.5">
                    <span class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center text-xs border border-emerald-500/40">$</span>
                    <div>
                      <p class="text-xs font-bold text-white">Pesos Argentinos</p>
                      <p class="text-[10px] text-gray-400">ARS</p>
                    </div>
                  </div>
                  <span id="check-ars" class="text-turquoiseNeon text-xs font-bold">✓</span>
                </button>

                <button
                  type="button"
                  data-moneda="USD"
                  class="opcion-moneda w-full flex items-center justify-between p-2.5 rounded-lg text-left hover:bg-[#0D0B14] transition"
                >
                  <div class="flex items-center space-x-2.5">
                    <span class="w-7 h-7 rounded-full bg-turquoiseNeon/20 text-turquoiseNeon font-bold flex items-center justify-center text-xs border border-turquoiseNeon/40">US$</span>
                    <div>
                      <p class="text-xs font-bold text-white">Dólares Estadounidenses</p>
                      <p id="subtexto-usd" class="text-[10px] text-gray-400">USD</p>
                    </div>
                  </div>
                  <span id="check-usd" class="text-turquoiseNeon text-xs font-bold hidden">✓</span>
                </button>
              </div>
            </div>

            <!-- Contenedor Código QR -->
            <div
              class="qr-container bg-white p-4 rounded-xl w-52 h-52 mx-auto mb-6 flex items-center justify-center shadow-inner"
            >
              <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=0000003100012345678901"
                alt="Código QR para depósito"
                id="qr-deposito"
                class="w-full h-full object-contain"
              />
            </div>

            <!-- Formulario de Datos -->
            <form id="form-deposito" class="space-y-5">
              <!-- Info Email de la Cuenta -->
              <div class="campo">
                <span class="block text-xs text-gray-400 mb-1 font-medium">Email vinculado</span>
                <div class="flex items-center justify-between bg-[#0D0B14] border border-gray-800 rounded-xl px-4 py-2.5 w-full">
                  <span id="email-usuario" class="user-email text-xs md:text-sm font-mono text-white truncate pr-2">
                    cargando...
                  </span>
                  <button
                          type="button"
                          id="btn-copiar-email"
                          class="text-xs text-turquoiseNeon font-semibold hover:text-white transition shrink-0"
                  >
                    Copiar
                  </button>
                </div>
              </div>

              <!-- Campo para Ingresar Monto -->
              <div class="campo">
                <label for="monto" class="block text-xs text-gray-400 mb-1 font-medium">Monto a depositar</label>
                <div class="flex items-center bg-[#0D0B14] border border-gray-800 rounded-xl px-4 py-2.5 focus-within:border-turquoiseNeon w-full">
                  <span id="simbolo-monto-deposito" class="text-gray-400 mr-2 font-mono font-bold">$</span>
                  <input type="number" id="monto" name="monto" placeholder="0.00" min="1" step="0.01"
                         class="bg-transparent flex-1 text-sm text-white outline-none">
                </div>
              </div>

              <!-- Mensaje de Notificación -->
              <div id="mensaje-notificacion" class="text-xs text-center font-medium hidden"></div>

              <!-- Botón Principal -->
              <div class="botones-accion pt-4">
                <button
                  type="submit"
                  id="btn-depositar"
                  class="w-full bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition duration-300 glow-button"
                >
                  Depositar Pesos (ARS)
                </button>
              </div>
            </form>

            <!-- Alternativa: cargar saldo con Mercado Pago (sandbox) -->
            <div class="mt-6 pt-6 border-t border-gray-800/80">
              <p class="text-xs text-gray-400 mb-3 text-center">o cargá el mismo monto con</p>
              <button
                type="button"
                id="btn-mercadopago"
                class="w-full border border-turquoiseNeon text-turquoiseNeon font-bold py-3 rounded-xl hover:bg-turquoiseNeon/10 transition duration-300 text-sm"
              >
                Mercado Pago
              </button>
              <div id="mercadopago-mensaje" class="text-xs text-center font-medium hidden pt-3"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <footer class="w-full text-center text-xs text-gray-500 mt-8">
        <p>&copy; 2026 ALKYWALLET. Todos los derechos reservados</p>
      </footer>
    </main>
  </body>
</html>
