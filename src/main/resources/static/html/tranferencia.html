<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlkyWallet - Transferencias</title>

    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de Colores Personalizados para Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgMain: "#0D0B14",
              cardDark: "#161221",
              fuchsiaNeon: "#E025CE",
              turquoiseNeon: "#00F2FE",
              textLight: "#F4F4F6",
            },
          },
        },
      };
    </script>

    <!-- Enlaces a Hojas de Estilo y Scripts -->
    <link rel="stylesheet" href="../css/custom.css" />
    <link rel="stylesheet" href="../css/dashboard.module.css" />
    <script defer src="../js/balance-visibility.js"></script>
    <script defer src="../js/tranferencia.js"></script>
    <script defer src="../js/sidebar.js"></script>
    <script defer src="../js/auth-session.js"></script>
  </head>
  <body
    class="bg-bgMain text-textLight min-h-screen flex flex-col md:flex-row relative font-sans m-0 p-0 overflow-x-hidden"
  >
    <!-- LUCES DE FONDO DE NEÓN -->
    <div
      class="absolute -top-10 -left-10 w-96 h-96 bg-fuchsiaNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute -bottom-10 -right-10 w-96 h-96 bg-turquoiseNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"
    ></div>

    <!-- SIDEBAR / MENÚ LATERAL -->
    <aside
      class="w-full md:w-64 md:sticky md:top-0 md:h-screen bg-cardDark/80 backdrop-blur-md border-b md:border-b-0 md:border-r border-gray-800 p-4 md:p-6 flex flex-col justify-between z-20 shrink-0"
    >
      <div>
        <!-- Header Móvil + Logo -->
        <div
          class="flex items-center justify-between md:justify-start space-x-3 mb-4 md:mb-8"
        >
          <div class="flex items-center space-x-3">
            <div
              class="w-10 h-10 md:w-12 md:h-12 bg-cardDark border border-fuchsiaNeon rounded-xl flex items-center justify-center shadow-lg shrink-0"
            >
              <svg
                class="w-6 h-6 md:w-7 md:h-7"
                fill="none"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="#00F2FE"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M7 20V4m0 0L3 8m4-4l4 4"
                />
                <path
                  stroke="#E025CE"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17 4v16m0 0l4-4m-4 4l-4-4"
                />
              </svg>
            </div>
            <h1
              class="text-lg md:text-xl font-extrabold tracking-wider whitespace-nowrap"
            >
              <span
                class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon"
                >ALKY</span
              >WALLET
            </h1>
          </div>

          <!-- Botón Hamburguesa (Solo visible en Mobile) -->
          <button
            id="btn-menu"
            class="md:hidden text-gray-400 hover:text-white focus:outline-none"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>

        <!-- Navegación: Oculta en Mobile por defecto (`hidden`), visible en Desktop (`md:flex`) -->
        <nav
          id="menu-nav"
          class="hidden md:flex flex-col space-y-2 mt-4 md:mt-0 border-t border-gray-800/80 pt-4 md:pt-0 md:border-0"
        >
          <!-- 1. Dashboard -->
          <a
            href="tableroDeControl.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              />
            </svg>
            <span>Dashboard</span>
          </a>

          <!-- 2. Transferencias (ACTIVO) -->
          <a
            href="tranferencia.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-fuchsiaNeon to-purple-600 text-white font-semibold shadow-lg text-sm"
          >
            <svg
              class="w-5 h-5 opacity-90"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
              />
            </svg>
            <span>Transferencias</span>
          </a>

          <!-- 3. Depósitos -->
          <a
            href="deposito.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6v6m0 0v6m0-6h6m-6 0H6"
              />
            </svg>
            <span>Depósitos</span>
          </a>

          <!-- 4. Inversiones -->
          <a
            href="inversiones.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 17l6-6 4 4 8-8M21 7v6m0-6h-6"
              />
            </svg>
            <span>Inversiones</span>
          </a>

          <!-- 5. Servicios -->
          <a
            href="servicios.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <rect x="4" y="4" width="7" height="7" rx="1.5" stroke-width="2" />
              <rect x="13" y="4" width="7" height="7" rx="1.5" stroke-width="2" />
              <rect x="4" y="13" width="7" height="7" rx="1.5" stroke-width="2" />
              <rect x="13" y="13" width="7" height="7" rx="1.5" stroke-width="2" />
            </svg>
            <span>Servicios</span>
          </a>

          <!-- 6. Perfil -->
          <a
            href="perfil.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-cardDark/80 hover:text-white transition font-medium text-sm"
          >
            <svg
              class="w-5 h-5 opacity-80"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span>Perfil</span>
          </a>
        </nav>
      </div>

      <!-- Botón Salir -->
      <div
        id="menu-salir"
        class="hidden md:block pt-4 border-t border-gray-800 mt-6"
      >
        <button
          id="btn-salir"
          class="w-full flex items-center space-x-2 text-gray-400 hover:text-red-400 transition text-sm font-medium"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5"
            />
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main
      class="flex-grow flex flex-col justify-between p-6 md:p-12 z-10 min-h-screen"
    >
      <div>
        <!-- HEADER SUPERIOR DE USUARIO -->
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-2xl font-bold text-white">Transferencias</h2>
            <p class="text-xs text-gray-400 mt-1">Envío de dinero al instante</p>
          </div>

          <!-- Avatar superior -->
          <div
            class="flex items-center space-x-3 bg-cardDark/60 backdrop-blur-md px-4 py-2 rounded-full border border-gray-800"
          >
            <span class="user-email text-sm font-medium text-white">Cargando...</span>
            <img
              src="https://i.pravatar.cc/100?img=12"
              alt="Foto de Perfil"
              class="w-8 h-8 rounded-full border border-turquoiseNeon object-cover"
            />
          </div>
        </div>

        <!-- CONTENEDOR FORMULARIO -->
        <div class="max-w-xl mx-auto w-full">
          <div
            class="formulario-box bg-cardDark rounded-2xl p-6 md:p-8 relative shadow-2xl border border-fuchsiaNeon/30 glow-card-fuchsia"
          >
            <h2
              class="text-xl md:text-2xl font-bold mb-6 text-white text-center"
            >
              Transferir dinero
            </h2>

            <form id="form-transferencia" class="space-y-4" novalidate>
              <!-- Cuenta Origen con Selector de Moneda -->
              <div class="campo">
                <div class="flex justify-between items-center mb-1">
                  <label for="cuenta-origen" class="block text-xs text-gray-400 font-medium">Moneda / Cuenta Origen</label>
                  <span id="label-cuenta-tipo" class="text-[11px] text-turquoiseNeon font-semibold">Pesos Argentinos</span>
                </div>
                <select
                  id="cuenta-origen"
                  name="cuenta-origen"
                  class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm font-medium"
                >
                  <option value="ARS">Cuenta en Pesos (ARS)</option>
                  <option value="USD" id="option-usd" class="hidden">Caja de Ahorro en Dólares (USD)</option>
                </select>
              </div>

              <!-- Cuenta Destino -->
              <div class="campo">
                <label
                  for="cuenta-destino"
                  class="block text-xs text-gray-400 mb-1 font-medium"
                  >Hacia (Email)</label
                >
                <input
                  type="email"
                  id="cuenta-destino"
                  name="cuenta-destino"
                  placeholder="usuario@ejemplo.com"
                  class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm"
                />
              </div>

              <!-- Monto -->
              <div class="campo">
                <div class="flex justify-between items-center mb-1">
                  <label for="monto" class="block text-xs text-gray-400 font-medium">Monto</label>
                  <span class="text-xs text-gray-400 flex items-center gap-1">
                    Disponible: <strong id="saldo-disponible" class="text-turquoiseNeon font-mono">$ 0,00</strong>
                    <button type="button" id="btn-toggle-saldo" aria-label="Ocultar saldo" class="text-gray-400 hover:text-turquoiseNeon transition p-0.5"></button>
                  </span>
                </div>

                <div class="flex space-x-2">
                  <input
                    type="number"
                    id="monto"
                    name="monto"
                    placeholder="0.00"
                    min="1"
                    step="0.01"
                    class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm font-semibold"
                  />
                  <button
                    type="button"
                    id="btn-all"
                    class="bg-gray-800 hover:bg-gray-700 text-turquoiseNeon px-4 py-2.5 rounded-xl text-xs font-bold transition border border-gray-700"
                  >
                    Total
                  </button>
                </div>
              </div>

              <!-- Categoría -->
              <div class="campo">
                <label
                  for="categoria"
                  class="block text-xs text-gray-400 mb-1 font-medium"
                  >Categoría</label
                >
                <select
                  id="categoria"
                  name="categoria"
                  class="w-full bg-[#0D0B14] text-white border border-gray-800 rounded-xl px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition text-sm"
                >
                  <option value="TRANSFERENCIA" selected>Transferencia</option>
                  <option value="COMIDA">Comida</option>
                  <option value="TRANSPORTE">Transporte</option>
                  <option value="SERVICIOS">Servicios</option>
                  <option value="ENTRETENIMIENTO">Entretenimiento</option>
                  <option value="SALUD">Salud</option>
                  <option value="EDUCACION">Educación</option>
                  <option value="OTROS">Otros</option>
                </select>
              </div>

              <!-- Notificación Dinámica -->
              <div
                id="mensaje-notificacion"
                class="hidden p-3 rounded-xl text-xs font-medium text-center"
              ></div>

              <!-- Botones de Acción -->
              <div class="flex space-x-4 pt-4">
                <button
                  type="button"
                  id="btn-cancelar"
                  class="w-1/3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-3 rounded-xl transition text-sm"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  id="btn-transferir"
                  class="w-2/3 bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition duration-300 glow-button text-sm"
                >
                  Transferir
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <footer class="w-full text-center text-xs text-gray-500 mt-8">
        <p>&copy; 2026 ALKYWALLET. Todos los derechos reservados</p>
      </footer>
    </main>
  </body>
</html>
