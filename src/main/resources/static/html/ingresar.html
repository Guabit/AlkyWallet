<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkyWallet - Iniciar Sesión</title>
    
    
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración de Colores Personalizados para Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgMain: '#0D0B14',
              cardDark: '#161221',
              fuchsiaNeon: '#E025CE',
              turquoiseNeon: '#00F2FE',
              textLight: '#F4F4F6',
            }
          }
        }
      }
    </script>

    <!-- Hoja de estilos personalizados -->
    <link rel="stylesheet" href="../css/custom.css">
    <script defer src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script defer src="../js/ingresar.js"></script>

</head>
<body class="bg-bgMain text-textLight min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

    <!-- LUCES DE FONDO DE NEÓN -->
    <div class="absolute -top-10 -left-10 w-96 h-96 bg-fuchsiaNeon rounded-full opacity-25 filter blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -right-10 w-96 h-96 bg-turquoiseNeon rounded-full opacity-20 filter blur-3xl pointer-events-none"></div>

    <!-- CONTENEDOR PRINCIPAL (2 Columnas) -->
    <div class="w-full max-w-4xl mx-auto p-6 flex flex-col md:flex-row items-center justify-between gap-12 z-10">
        
        <!-- COLUMNA IZQUIERDA: Logo Branding -->
        <div class="flex flex-col items-start space-y-4">
            <div class="flex items-center space-x-3">
               <div class="w-12 h-12 bg-cardDark border border-fuchsiaNeon rounded-xl flex items-center justify-center glow-fuchsia-sm">
    <svg class="w-7 h-7" fill="none" stroke-width="2.5" viewBox="0 0 24 24">
        <!-- Flecha Izquierda (Subiendo en Turquesa) -->
        <path stroke="#00F2FE" stroke-linecap="round" stroke-linejoin="round" d="M7 20V4m0 0L3 8m4-4l4 4" />
        
        <!-- Flecha Derecha (Bajando en Fucsia) -->
        <path stroke="#E025CE" stroke-linecap="round" stroke-linejoin="round" d="M17 4v16m0 0l4-4m-4 4l-4-4" />
    </svg>
</div>
                <div>
                    <h1 class="text-3xl font-extrabold tracking-wider">
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon">ALKY</span>WALLET
                    </h1>
                    <p class="text-xs text-turquoiseNeon tracking-widest font-semibold uppercase">Virtual Financial System</p>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: Card de Iniciar Sesión -->
        <div class="w-full max-w-md bg-cardDark rounded-2xl p-8 relative shadow-2xl glow-card-fuchsia border border-fuchsiaNeon/30">
            
            <!-- Avatar Circular Flotante -->
            <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                <div class="w-20 h-20 rounded-full bg-cardDark border-2 border-turquoiseNeon flex items-center justify-center glow-turquoise">
                    <svg class="w-10 h-10 text-turquoiseNeon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
            </div>

            <!-- Título del Formulario -->
            <h2 class="text-xl font-bold text-center mt-6 mb-8 tracking-wide text-white">INICIAR SESIÓN</h2>

            <!-- Formulario -->
            <form id="ingreso" class="space-y-5" novalidate>
                <div>
                    <label for="Iemail" class="block text-sm text-gray-400 mb-1 font-medium">Email</label>
                    <input type="email" id="Iemail" placeholder="tuemail@ejemplo.com"
                           class="w-full bg-[#0D0B14] text-white border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition duration-200">
                    <p id="errorEmail" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <div>
                    <label for="Ipassword" class="block text-sm text-gray-400 mb-1 font-medium">Password</label>
                    <input type="password" id="Ipassword" placeholder="••••••••"
                           class="w-full bg-[#0D0B14] text-white border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-turquoiseNeon focus:ring-1 focus:ring-turquoiseNeon transition duration-200">
                    <p id="errorPassword" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <!-- Mensaje de éxito -->
                <p id="mensajeExito" class="text-emerald-400 text-sm text-center font-semibold hidden"></p>

                <!-- Mensaje de error general del servidor -->
                <p id="mensajeError" class="text-red-500 text-sm text-center font-semibold hidden"></p>

                <div class="pt-4 flex items-center justify-between">
                    <button type="submit" 
                            class="w-32 bg-gradient-to-r from-fuchsiaNeon to-turquoiseNeon text-white font-bold py-2.5 rounded-lg shadow-lg hover:opacity-90 transition duration-300 glow-button">
                        Sign in
                    </button>
                    <a href="./registro.html" class="text-sm text-turquoiseNeon hover:underline">
                        ¿No tienes una cuenta?
                    </a>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
